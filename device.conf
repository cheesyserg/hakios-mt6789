# devices/x6885/device.conf: the phone, for the common repository's device tooling (tools/hakios-device.py; the same
# words as hakios-sm7325's device.conf). Its SoC's layer would be the common repository's mtk/mt6789/, which does not
# exist yet (docs/x6885-port.md). Nothing below has been run on the phone: "missing" until a run's log says otherwise.
device x6885
	title	Infinix Hot 60 Pro (X6885)
	vendor	Infinix
	soc	mt6789
	defconfig	x6885_defconfig
	firmware	pull-firmware.sh
	maintainer	the HakiOS developers (README.md)
	status boot missing loader ported (boot image v4, entry at 0x40000000, memory map from LK's tree); not run
	status display missing 1224x2720 AMOLED, video mode with DSC: LK's framebuffer through OVL0 0x14005000; not run
	status touch missing Goodix controller ("goodix,touch"); no driver yet
	status buttons missing keypad 0x10010000 (volume down key 0), power key through the PMIC wrapper 0x10026000 (buttons=3); not run
	status cpu missing 6x Cortex-A55 + 2x Cortex-A76, same MPIDRs as the MT6768; no clock change
	status gpu missing Mali-G57 MC2 (Valhall) at 0x13000000; the G52's bring-up does not apply
	status storage missing UFS 2.2 at 0x11270000, read only (ufs_root=1); not run
	status sensors missing
	status wifi missing CONNSYS of the MT6789, not the MT6768's; nothing yet
	status bluetooth missing
	status audio missing
	status battery missing
	status haptic missing
	status camera missing
	status torch missing
	status cellular missing
	status thermal missing
